<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glam Studios POS — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#0f0d12;--surface:#1a1720;--surface2:#211e29;--border:#2e2a38;
      --accent:#e5b3a6;--accent2:#c9889a;--accent3:#a06080;
      --text:#f0ecf5;--muted:#8a8298;--danger:#e57373;--success:#5ecba1;
      --input-bg:#252231;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .auth-wrap { width:100%; max-width:400px; padding:24px; }
    .auth-logo { text-align:center; margin-bottom:32px; }
    .auth-logo-icon { width:56px; height:56px; background:linear-gradient(135deg,var(--accent),var(--accent3)); border-radius:16px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:white; margin:0 auto 12px; }
    .auth-logo-title { font-size:22px; font-weight:800; color:var(--text); }
    .auth-logo-sub { font-size:13px; color:var(--muted); margin-top:4px; }
    .auth-card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:28px; }
    .auth-tabs { display:flex; gap:4px; background:var(--surface2); border-radius:12px; padding:4px; margin-bottom:24px; }
    .auth-tab { flex:1; padding:8px; border-radius:8px; border:none; background:transparent; color:var(--muted); font-size:14px; font-weight:500; cursor:pointer; transition:all .2s; }
    .auth-tab.active { background:var(--surface); color:var(--text); font-weight:600; }
    .form-group { margin-bottom:16px; }
    .form-group label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:500; }
    .form-group input, .form-group select { width:100%; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--input-bg); color:var(--text); font-size:14px; outline:none; font-family:'Inter',sans-serif; }
    .form-group input:focus, .form-group select:focus { border-color:var(--accent); }
    .btn-submit { width:100%; padding:12px; background:linear-gradient(135deg,var(--accent),var(--accent3)); border:none; border-radius:12px; color:white; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; transition:all .2s; }
    .btn-submit:hover { opacity:.9; transform:translateY(-1px); }
    .btn-submit:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .error-msg { color:var(--danger); font-size:13px; text-align:center; margin-top:12px; min-height:18px; }
    .success-msg { color:var(--success); font-size:13px; text-align:center; margin-top:12px; }
    .divider { text-align:center; color:var(--muted); font-size:12px; margin:16px 0; }
    .role-info { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:16px; font-size:12px; color:var(--muted); line-height:1.6; }
    .role-info strong { color:var(--accent); }
    #page-register { display:none; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-logo">
      <div class="auth-logo-icon">G</div>
      <div class="auth-logo-title">Glam Studios</div>
      <div class="auth-logo-sub">Point of Sale System</div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')" id="tab-login">Masuk</button>
        <button class="auth-tab" onclick="switchTab('register')" id="tab-register">Daftar</button>
      </div>

      <!-- LOGIN -->
      <div id="page-login">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="email@glamstudios.com" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Password" />
        </div>
        <button class="btn-submit" onclick="doLogin()" id="btn-login">Masuk</button>
        <div class="error-msg" id="login-error"></div>
      </div>

      <!-- REGISTER -->
      <div id="page-register">
        <div class="role-info">
          Akun baru otomatis mendapat role <strong>Kasir</strong>.<br>
          Hubungi Owner untuk mengubah role menjadi Manager atau Owner.
        </div>
        <div class="form-group">
          <label>Nama Lengkap</label>
          <input type="text" id="reg-name" placeholder="Nama karyawan" />
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="email@glamstudios.com" />
        </div>
        <div class="form-group">
          <label>Password (min 6 karakter)</label>
          <input type="password" id="reg-password" placeholder="Password" />
        </div>
        <button class="btn-submit" onclick="doRegister()" id="btn-register">Daftar Akun</button>
        <div class="error-msg" id="register-error"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js';
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc } from 'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDoDHrv397jsdz3n_r6uW-jO4ffXHdVVf8",
      authDomain: "glam-studio-pos.firebaseapp.com",
      projectId: "glam-studio-pos",
      storageBucket: "glam-studio-pos.firebasestorage.app",
      messagingSenderId: "107739266832",
      appId: "1:107739266832:web:cd0db1cd0277f1b110ef95"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Redirect if already logged in
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        window.location.href = 'pos.html';
      }
    });

    window.switchTab = (tab) => {
      document.getElementById('page-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('page-register').style.display = tab === 'register' ? 'block' : 'none';
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-register').classList.toggle('active', tab === 'register');
    };

    window.doLogin = async () => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-password').value;
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('btn-login');
      errEl.textContent = '';
      if (!email || !pass) { errEl.textContent = 'Email dan password wajib diisi!'; return; }
      btn.disabled = true; btn.textContent = 'Memproses...';
      try {
        await signInWithEmailAndPassword(auth, email, pass);
        window.location.href = 'pos.html';
      } catch (e) {
        errEl.textContent = e.code === 'auth/invalid-credential' ? 'Email atau password salah.' : e.message;
        btn.disabled = false; btn.textContent = 'Masuk';
      }
    };

    window.doRegister = async () => {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-password').value;
      const errEl = document.getElementById('register-error');
      const btn = document.getElementById('btn-register');
      errEl.textContent = '';
      if (!name || !email || !pass) { errEl.textContent = 'Semua field wajib diisi!'; return; }
      if (pass.length < 6) { errEl.textContent = 'Password minimal 6 karakter!'; return; }
      btn.disabled = true; btn.textContent = 'Mendaftar...';
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, pass);
        // Check if first user → Owner, else Kasir
        const usersSnap = await getDoc(doc(db, 'app_meta', 'stats'));
        const isFirst = !usersSnap.exists();
        const role = isFirst ? 'owner' : 'kasir';
        await setDoc(doc(db, 'users', cred.user.uid), {
          name, email, role, createdAt: new Date().toISOString()
        });
        if (isFirst) {
          await setDoc(doc(db, 'app_meta', 'stats'), { initialized: true });
        }
        window.location.href = 'pos.html';
      } catch (e) {
        errEl.textContent = e.code === 'auth/email-already-in-use' ? 'Email sudah terdaftar.' : e.message;
        btn.disabled = false; btn.textContent = 'Daftar Akun';
      }
    };

    // Enter key support
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const active = document.getElementById('page-login').style.display !== 'none';
        if (active) window.doLogin(); else window.doRegister();
      }
    });
  </script>
</body>
</html>
